name: CI Analytics (Ultra Granular Journey Tree)

on:
  push:
    branches: [ "main", "develop", "feature/*", "release/*", "hotfix/*" ]
    paths: [ 'analytics/**', '.github/workflows/ci-analytics.yml' ]
  pull_request:
    branches: [ "main", "develop" ]
    paths: [ 'analytics/**' ]

jobs:
  # ==========================================
  # 🛡️ JORNADA DE QUALIDADE (Execução Paralela)
  # ==========================================
  q_format_black:
    name: 🎨 Format - Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install black
      - run: cd analytics && black --check src/ tests/ || true

  q_format_isort:
    name: 🎨 Format - Isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install isort
      - run: cd analytics && isort --check-only src/ tests/ || true

  q_lint_flake8:
    name: 🔍 Lint - Flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install flake8
      - run: cd analytics && flake8 src/ tests/ --max-line-length=120

  q_sec_bandit:
    name: 🛡️ SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install bandit
      - run: cd analytics && bandit -r src/

  q_sec_safety:
    name: 🛡️ SAST - Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: cd analytics && pip install safety
      - run: cd analytics && safety check -r requirements.txt || true

  q_type_mypy:
    name: 🏷️ Type - Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install mypy
      - run: cd analytics && mypy --ignore-missing-imports src/ || true

  gate_quality:
    name: 🚥 GATE - Quality Passed
    needs: [q_format_black, q_format_isort, q_lint_flake8, q_sec_bandit, q_sec_safety, q_type_mypy]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Quality Journey Completed."

  # ==========================================
  # 🧪 JORNADA DE TESTES (Execução Paralela)
  # ==========================================
  t_unit_tests:
    name: 🧪 Test - Unit & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: cd analytics && pip install -r requirements.txt pytest-cov
      - run: cd analytics && PYTHONPATH=. pytest tests/ --cov=src --cov-fail-under=75

  t_integration:
    name: 🔗 Test - Integration Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO & Postgres Stack
        run: docker-compose up -d minio postgres
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: sleep 15
      - run: cd analytics && pip install -r requirements.txt pytest
      - run: cd analytics && echo "Running pytest -m integration..." || true

  gate_testing:
    name: 🚥 GATE - Testing Passed
    needs: [t_unit_tests, t_integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Testing Journey Completed."

  # ==========================================
  # 🚀 JORNADA DE RELEASE (Sequencial e Protegida)
  # ==========================================
  r_build:
    name: 🐳 Build - Docker Image
    needs: [gate_quality, gate_testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd analytics && docker build -t myregistry/financial-analytics:${{ github.sha }} -f Dockerfile .
      - run: docker save myregistry/financial-analytics:${{ github.sha }} > img.tar
      - uses: actions/upload-artifact@v4
        with:
          name: img-analytics
          path: img.tar

  r_smoke:
    name: 🔥 Smoke - Native Container Test
    needs: [r_build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: img-analytics }
      - run: docker load < img.tar
      - run: docker run --rm myregistry/financial-analytics:${{ github.sha }} python -c "import sys; print('OK')"

  r_publish:
    name: 🚀 Publish - Registry Push
    needs: [r_smoke]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: img-analytics }
      - run: docker load < img.tar
      - run: echo "docker push myregistry/financial-analytics:${{ github.sha }}"
