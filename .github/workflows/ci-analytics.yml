name: CI Analytics (DAG Layered Architecture)

on:
  push:
    branches: [ "main", "develop", "feature/*", "release/*", "hotfix/*" ]
    paths: [ 'analytics/**', '.github/workflows/ci-analytics.yml' ]
  pull_request:
    branches: [ "main", "develop" ]
    paths: [ 'analytics/**' ]

jobs:
  # ==========================================================
  # CAMADA 1: Syntax Check & Formatação (Fast Fail)
  # ==========================================================
  lint_and_format:
    name: 01A - Lint & Format (Black, Isort, Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install black isort flake8
      - run: cd analytics && black --check src/ tests/ || echo "Black would format"
      - run: cd analytics && isort --check-only src/ tests/ || echo "Isort would format"
      - run: cd analytics && flake8 src/ tests/ --max-line-length=120

  dryrun_syntax:
    name: 01B - Syntax Dryrun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall analytics/src/ analytics/tests/

  # ==========================================================
  # CAMADA 2: Análise Estática & Segurança
  # ==========================================================
  security_sast:
    name: 02A - Security Scan (Bandit & Safety)
    needs: [lint_and_format, dryrun_syntax]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: cd analytics && pip install bandit safety
      - run: cd analytics && bandit -r src/
      - run: cd analytics && safety check -r requirements.txt || true

  static_typing:
    name: 02B - Typing (Mypy)
    needs: [lint_and_format, dryrun_syntax]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install mypy
      - run: cd analytics && mypy --ignore-missing-imports src/ || true

  # ==========================================================
  # CAMADA 3: Processos de Testes Separados
  # ==========================================================
  unit_tests_core:
    name: 03A - Unit Tests (PySpark Core)
    needs: [security_sast, static_typing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: cd analytics && pip install -r requirements.txt pytest-cov
      - run: cd analytics && PYTHONPATH=. pytest tests/ --cov=src --cov-report=xml --cov-fail-under=75

  integration_tests_stack:
    name: 03B - Integration Tests (Local Stack)
    needs: [security_sast, static_typing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO & Postgres (Docker Compose)
        run: docker-compose up -d minio postgres
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sleep 15
      - run: cd analytics && pip install -r requirements.txt pytest
      - run: echo "Running pytest -m integration (Skipped for now)"

  # ==========================================================
  # CAMADA 4: Isolamento do Build e Smoke Test Container
  # ==========================================================
  container_layer_build:
    name: 04A - Containerfile Layer Compilation
    needs: [unit_tests_core, integration_tests_stack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Container
        run: cd analytics && docker build -t financial-analytics:ci -f Dockerfile .
      - name: Save Container Image Artifact
        run: |
          mkdir -p /tmp/container-image
          docker save financial-analytics:ci -o /tmp/container-image/analytics-ci.tar
      - name: Upload Container Image
        uses: actions/upload-artifact@v4
        with:
          name: analytics-container-image
          path: /tmp/container-image/analytics-ci.tar
          retention-days: 1

  container_native_smoke:
    name: 04B - Container Native Smoke Test
    needs: container_layer_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: analytics-container-image
          path: /tmp/container-image
      - name: Load Container Image
        run: docker load -i /tmp/container-image/analytics-ci.tar
      - name: Validate Execution Inside Container
        run: docker run --rm financial-analytics:ci python -c "import sys; print('Smoke Test Passed')"

  # ==========================================================
  # CAMADA 5: Gatekeeper Central para Regras de Branch
  # ==========================================================
  status_gatekeeper:
    name: 05 - Branch Protection Gatekeeper
    if: always()
    needs:
      - lint_and_format
      - dryrun_syntax
      - security_sast
      - static_typing
      - unit_tests_core
      - integration_tests_stack
      - container_layer_build
      - container_native_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate DAG Workflow Results
        run: |
          RESULTS="${{ join(needs.*.result, ',') }}"
          echo "DAG node results: $RESULTS"
          if [[ "$RESULTS" =~ "failure" ]] || [[ "$RESULTS" =~ "cancelled" ]]; then
            echo "One or more required DAG jobs failed or were cancelled."
            exit 1
          fi
          echo "All required DAG jobs passed or were skipped successfully."

  # ==========================================================
  # CAMADA 6: Publish (Apenas Main/Release)
  # ==========================================================
  publish_registry:
    name: 06 - Publish Image to Registry
    needs: status_gatekeeper
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: analytics-container-image
          path: /tmp/container-image
      - name: Load Image
        run: docker load -i /tmp/container-image/analytics-ci.tar
      - name: Push to Registry (Mock)
        run: echo "docker tag financial-analytics:ci myregistry/financial-analytics:${{ github.sha }} && docker push myregistry/financial-analytics:${{ github.sha }}"
