name: CI Analytics
on:
  push:
    paths:
      - 'analytics/**'
      - '.github/workflows/ci-analytics.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd analytics
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd analytics
          PYTHONPATH=. pytest tests/
