name: CI Producer
on:
  push:
    paths:
      - 'producer/**'
      - '.github/workflows/ci-producer.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd producer
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd producer
          PYTHONPATH=. pytest tests/
