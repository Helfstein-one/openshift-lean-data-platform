name: CI Producer (Fan-out / Fan-in Parallel Tree)

on:
  push:
    branches: [ "main", "develop", "feature/*", "release/*", "hotfix/*" ]
    paths: [ 'producer/**', '.github/workflows/ci-producer.yml' ]
  pull_request:
    branches: [ "main", "develop" ]
    paths: [ 'producer/**' ]

jobs:
  format-check:
    name: 🎨 Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: pip install black isort
      - run: cd producer && black --check src/ tests/ || true
      - run: cd producer && isort --check-only src/ tests/ || true

  lint:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: pip install flake8
      - run: flake8 producer/src/ producer/tests/ --max-line-length=120

  security-sast:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: cd producer && pip install bandit safety
      - run: cd producer && bandit -r src/
      - run: cd producer && safety check -r requirements.txt || true

  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: cd producer && pip install -r requirements.txt pytest-cov pytest-mock
      - run: cd producer && PYTHONPATH=. pytest tests/ --cov=src --cov-report=xml --cov-fail-under=75

  test-integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Kafka (Docker Compose)
        run: docker-compose up -d kafka
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: sleep 15
      - run: cd producer && pip install -r requirements.txt pytest
      - run: echo "Running pytest -m integration..."

  build-image:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cd producer && docker build -t myregistry/financial-producer:${{ github.sha }} -f Dockerfile .
      - name: Save Image
        run: docker save myregistry/financial-producer:${{ github.sha }} > producer.tar
      - uses: actions/upload-artifact@v4
        with:
          name: producer-docker-image
          path: producer.tar

  quality-gate:
    name: ✅ Quality Gate (Fan-in)
    needs: [format-check, lint, security-sast, test-unit, test-integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All parallel quality checks passed!"

  publish:
    name: 🚀 Publish (Registry)
    needs: [build-image, quality-gate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: producer-docker-image
      - name: Load Image
        run: docker load < producer.tar
      - name: Push to Registry
        run: echo "docker push myregistry/financial-producer:${{ github.sha }}"
