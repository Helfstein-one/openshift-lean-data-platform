apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: data-platform
data:
  pgbouncer.ini: |
    [databases]
    superset = host=superset-postgresql.data-platform.svc port=5432 dbname=superset

    [pgbouncer]
    listen_addr = *
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 100
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool = 5
    reserve_pool_timeout = 5
    admin_users = admin
    stats_users = admin
  userlist.txt: |
    "admin" "admin123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:1.21.0
        ports:
        - containerPort: 6432
          name: pgbouncer
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /etc/pgbouncer
      volumes:
      - name: config
        configMap:
          name: pgbouncer-config
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: data-platform
spec:
  ports:
  - port: 6432
    targetPort: 6432
    name: pgbouncer
  selector:
    app: pgbouncer
