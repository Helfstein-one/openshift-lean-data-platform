apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller-broker
  namespace: data-platform
  labels:
    strimzi.io/cluster: data-cluster
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  jvmOptions:
    "-Xms": "256m"
    "-Xmx": "256m"
    "-XX":
      "UseG1GC": "true"
      "ExitOnOutOfMemoryError": "true"
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: data-cluster
  namespace: data-platform
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.7.0
    metadataVersion: 3.7-IV4
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 256Mi
    userOperator:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 256Mi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: eventos-financeiros
  namespace: data-platform
  labels:
    strimzi.io/cluster: data-cluster
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 7200000
    segment.bytes: 104857600
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: s3-sink-connect
  namespace: data-platform
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 3.7.0
  replicas: 1
  bootstrapServers: data-cluster-kafka-bootstrap.data-platform.svc:9092
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 512Mi
  jvmOptions:
    "-Xms": "256m"
    "-Xmx": "256m"
    "-XX":
      "UseG1GC": "true"
      "ExitOnOutOfMemoryError": "true"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: s3-sink-connector
  namespace: data-platform
  labels:
    strimzi.io/cluster: s3-sink-connect
spec:
  class: io.confluent.connect.s3.S3SinkConnector
  tasksMax: 1
  config:
    topics: eventos-financeiros
    s3.bucket.name: raw-financial-lake
    s3.region: us-east-1
    store.url: http://minio.data-platform.svc:9000
    flush.size: 1000
    storage.class: io.confluent.connect.s3.storage.S3Storage
    format.class: io.confluent.connect.s3.format.json.JsonFormat
    partitioner.class: io.confluent.connect.storage.partitioner.DefaultPartitioner
    schema.compatibility: NONE
